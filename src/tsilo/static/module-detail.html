<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="">
    <title>Module Detail - Tsilo</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="nav-container">
            <a href="/" class="nav-logo">Tsilo</a>
            <div class="nav-links">
                <a href="/" class="nav-link">Modules</a>
            </div>
            <div class="nav-auth" id="nav-auth">
                <a href="/auth/login" class="btn btn-primary btn-sm">Sign In</a>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <div id="module-detail" class="module-detail-container">
            <div class="loading-indicator" id="loading">
                <div class="spinner" role="status">
                    <span class="sr-only">Loading module details...</span>
                </div>
            </div>
        </div>

        <div id="error-container" class="error-container" hidden>
            <h2>Module Not Found</h2>
            <p id="error-message">The requested module could not be found.</p>
            <a href="/" class="btn btn-primary">Back to Modules</a>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-container">
            <p>&copy; 2026 Tsilo &mdash; Private Terraform Module Registry</p>
        </div>
    </footer>

    <script src="/static/js/module-detail.js"></script>
</body>
</html>
