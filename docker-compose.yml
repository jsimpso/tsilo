# Development services for Tsilo
# Start with: just dev-up
# Stop with:  just dev-down
# Requires:   podman + podman-compose / docker-compose

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tsilo
      POSTGRES_PASSWORD: tsilo
      POSTGRES_DB: tsilo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsilo"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/tsilo-modules;
      echo 'Bucket tsilo-modules ready';
      "

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm --health-enabled=true --http-management-port=9090
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./dev/keycloak/tsilo-realm.json:/opt/keycloak/data/import/tsilo-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "cat < /dev/null > /dev/tcp/localhost/9090"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 45s

volumes:
  pgdata:
  miniodata:
